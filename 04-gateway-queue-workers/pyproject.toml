[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gateway-queue-workers"
version = "0.1.0"
description = "Phase 4: MCP gateway + NATS JetStream job queue + worker pool + autoscaler"
requires-python = ">=3.11"
dependencies = [
    "mcp==1.30.0",
    "nats-py>=2.9",
    "docker>=7.1",
    "pydantic-settings>=2.5",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
extend = "../ruff.toml"
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration' --cov=mcpqueue --cov-report=term-missing --cov-fail-under=80"
markers = ["integration: needs the Docker Compose stack (docker compose up)"]

[tool.coverage.run]
# NATS and Docker adapters: exercised by tests/integration against the running stack.
omit = [
    "*/__main__.py",
    "*/mcpqueue/nats_client.py",
    "*/mcpqueue/gateway/job_bus.py",
    "*/mcpqueue/worker/job_consumer.py",
    "*/mcpqueue/autoscaler/queue_depth_monitor.py",
    "*/mcpqueue/autoscaler/worker_scaler.py",
]
