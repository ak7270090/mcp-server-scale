[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api-to-mcp-gateway"
version = "0.1.0"
description = "Phase 5: REST/gRPC services as MCP tools, and MCP tools as REST"
requires-python = ">=3.11"
dependencies = [
    "mcp==1.30.0",
    "httpx>=0.27",
    "grpcio>=1.66",
    "grpcio-reflection>=1.66",
    "protobuf>=5.28",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "pydantic-settings>=2.5",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.66",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "schemathesis>=4.0",
    "locust>=2.31",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
extend = "../ruff.toml"
src = ["src"]
extend-exclude = ["backends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration' --cov=apigateway --cov-report=term-missing --cov-fail-under=80"
markers = ["integration: needs the Docker Compose stack (docker compose up)"]

[tool.coverage.run]
omit = ["*/__main__.py"]
