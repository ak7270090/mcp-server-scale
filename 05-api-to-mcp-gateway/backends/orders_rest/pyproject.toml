[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orders-rest"
version = "0.1.0"
description = "Phase 5 sample REST backend (orders)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
extend = "../../../ruff.toml"
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
