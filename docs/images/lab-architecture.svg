<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="One test harness with pytest suites and a Locust load profile talks MCP over HTTP to whichever setup is running: Streamable HTTP, sticky load balancers, a gateway with a queue, or the API-to-MCP gateway; it writes results per phase; servers can send traces to Jaeger" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="420" rx="18" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- Harness -->
  <rect x="30" y="40" width="300" height="230" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="180" y="72" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b4b">test-harness</text>
  <text x="180" y="92" text-anchor="middle" font-size="12" fill="#475569">one client for every setup</text>
  <g font-size="13" fill="#1e1b4b">
    <rect x="52" y="110" width="256" height="40" rx="9" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="66" y="135">pytest: 7 behaviour suites</text>
    <rect x="52" y="160" width="256" height="40" rx="9" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="66" y="185">Locust: warm-up, steady, spike</text>
    <rect x="52" y="210" width="256" height="40" rx="9" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="66" y="235">harness/*.env: what to expect</text>
  </g>

  <!-- Results -->
  <rect x="30" y="310" width="300" height="76" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
  <text x="180" y="340" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">results/ in each phase</text>
  <text x="180" y="361" text-anchor="middle" font-size="12" fill="#475569">JUnit · Markdown reports · Locust CSV</text>
  <line x1="180" y1="270" x2="180" y2="306" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="188" y="294" font-size="12" fill="#475569">writes</text>

  <!-- Arrow to the setups -->
  <line x1="330" y1="155" x2="446" y2="155" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="388" y="143" text-anchor="middle" font-size="12" fill="#334155">MCP over HTTP</text>
  <text x="388" y="174" text-anchor="middle" font-size="11.5" fill="#64748b">one target URL</text>

  <!-- Setups -->
  <rect x="450" y="24" width="440" height="372" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="670" y="52" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">One setup at a time (Docker Compose)</text>
  <g font-size="13.5">
    <rect x="470" y="68" width="400" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="5 4"/>
    <text x="486" y="91" font-weight="600" fill="#0f172a">01 · stdio</text>
    <text x="486" y="109" font-size="12" fill="#64748b">one process per client · own unit tests, no HTTP</text>
    <rect x="470" y="130" width="400" height="52" rx="10" fill="#eff6ff" stroke="#2563eb"/>
    <text x="486" y="153" font-weight="600" fill="#0c1e4a">02 · Streamable HTTP</text>
    <text x="486" y="171" font-size="12" fill="#475569">one worker, then four workers</text>
    <rect x="470" y="192" width="400" height="52" rx="10" fill="#eff6ff" stroke="#2563eb"/>
    <text x="486" y="215" font-weight="600" fill="#0c1e4a">03 · sticky load balancers</text>
    <text x="486" y="233" font-size="12" fill="#475569">3 replicas · HAProxy, nginx, Envoy</text>
    <rect x="470" y="254" width="400" height="52" rx="10" fill="#eff6ff" stroke="#2563eb"/>
    <text x="486" y="277" font-weight="600" fill="#0c1e4a">04 · gateway + queue</text>
    <text x="486" y="295" font-size="12" fill="#475569">NATS JetStream workers · key-value state · autoscaler</text>
    <rect x="470" y="316" width="400" height="52" rx="10" fill="#ecfdf5" stroke="#059669"/>
    <text x="486" y="339" font-weight="600" fill="#064e3b">05 · API-to-MCP gateway</text>
    <text x="486" y="357" font-size="12" fill="#475569">REST + gRPC backends exposed as MCP tools</text>
  </g>

  <!-- Jaeger -->
  <rect x="960" y="150" width="210" height="80" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="1.3"/>
  <text x="1065" y="183" text-anchor="middle" font-size="14" font-weight="600" fill="#7c2d12">Jaeger</text>
  <text x="1065" y="204" text-anchor="middle" font-size="12" fill="#475569">which replica served each call</text>
  <line x1="890" y1="190" x2="956" y2="190" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
  <text x="923" y="180" text-anchor="middle" font-size="11.5" fill="#64748b">traces</text>
  <text x="1065" y="252" text-anchor="middle" font-size="11.5" fill="#64748b">optional, OTLP</text>
</svg>
