<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Three ways request 2 of an MCP session finds the state request 1 created: with four Uvicorn workers it lands on a worker without the session and gets 404; a sticky load balancer always routes it to the replica holding the session, which loses it if that replica dies; a gateway with a queue keeps the connection itself and the state in a key-value store, so any worker can run the call" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="540" rx="18" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- ============ Panel 1: four workers ============ -->
  <rect x="20" y="20" width="370" height="500" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="205" y="52" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">02 · one port, 4 workers</text>
  <text x="205" y="73" text-anchor="middle" font-size="12.5" fill="#475569">each worker keeps sessions in its own memory</text>

  <rect x="130" y="96" width="150" height="44" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="205" y="123" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b4b">MCP client</text>

  <line x1="205" y1="140" x2="205" y2="196" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="213" y="173" font-size="12" fill="#475569">requests 1 and 2</text>

  <rect x="105" y="198" width="200" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="205" y="225" text-anchor="middle" font-size="14" font-weight="600" fill="#0c1e4a">Uvicorn :8000</text>

  <g font-size="12.5" fill="#0c1e4a" text-anchor="middle">
    <rect x="34" y="300" width="78" height="70" rx="10" fill="#ffffff" stroke="#93c5fd"/>
    <text x="73" y="320">worker 1</text>
    <rect x="122" y="300" width="78" height="70" rx="10" fill="#ffffff" stroke="#93c5fd"/>
    <text x="161" y="320">worker 2</text>
    <rect x="210" y="300" width="78" height="70" rx="10" fill="#ffffff" stroke="#fca5a5"/>
    <text x="249" y="320">worker 3</text>
    <rect x="298" y="300" width="78" height="70" rx="10" fill="#ffffff" stroke="#93c5fd"/>
    <text x="337" y="320">worker 4</text>
  </g>
  <rect x="43" y="332" width="60" height="26" rx="7" fill="#fef3c7" stroke="#d97706"/>
  <text x="73" y="350" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">session S</text>

  <line x1="160" y1="242" x2="82" y2="296" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="104" y="262" text-anchor="end" font-size="12" fill="#334155">1 initialize</text>
  <line x1="245" y1="242" x2="249" y2="296" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-bad)"/>
  <text x="257" y="275" font-size="12" fill="#b91c1c">2 call with S</text>

  <text x="249" y="394" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">404</text>
  <text x="249" y="410" text-anchor="middle" font-size="12" fill="#b91c1c">unknown session</text>

  <text x="205" y="462" text-anchor="middle" font-size="13" fill="#334155">Request 2 can reach any worker.</text>
  <text x="205" y="482" text-anchor="middle" font-size="13" font-weight="600" fill="#b91c1c">Sessions break within a few calls.</text>

  <!-- ============ Panel 2: sticky load balancer ============ -->
  <rect x="415" y="20" width="370" height="500" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="600" y="52" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">03 · sticky load balancer</text>
  <text x="600" y="73" text-anchor="middle" font-size="12.5" fill="#475569">the balancer sends a session back to its replica</text>

  <rect x="525" y="96" width="150" height="44" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="600" y="123" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b4b">MCP client</text>

  <line x1="600" y1="140" x2="600" y2="196" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="608" y="173" font-size="12" fill="#475569">requests 1 and 2</text>

  <rect x="485" y="198" width="230" height="52" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="600" y="220" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Load balancer</text>
  <text x="600" y="238" text-anchor="middle" font-size="11.5" fill="#475569">cookie · ID prefix · Envoy envelope</text>

  <g font-size="12.5" fill="#0c1e4a" text-anchor="middle">
    <rect x="434" y="300" width="100" height="70" rx="10" fill="#ffffff" stroke="#93c5fd"/>
    <text x="484" y="320">replica 1</text>
    <rect x="550" y="300" width="100" height="70" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="600" y="320">replica 2</text>
    <rect x="666" y="300" width="100" height="70" rx="10" fill="#ffffff" stroke="#93c5fd"/>
    <text x="716" y="320">replica 3</text>
  </g>
  <rect x="570" y="332" width="60" height="26" rx="7" fill="#fef3c7" stroke="#d97706"/>
  <text x="600" y="350" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">session S</text>

  <line x1="600" y1="250" x2="600" y2="296" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-good)"/>
  <text x="608" y="279" font-size="12" fill="#15803d">both go to replica 2</text>

  <text x="600" y="394" text-anchor="middle" font-size="12" fill="#b91c1c">if replica 2 dies,</text>
  <text x="600" y="410" text-anchor="middle" font-size="12" fill="#b91c1c">S dies with it</text>

  <text x="600" y="462" text-anchor="middle" font-size="13" fill="#334155">Request 2 always finds S.</text>
  <text x="600" y="482" text-anchor="middle" font-size="13" font-weight="600" fill="#b45309">A replica restart loses its sessions.</text>

  <!-- ============ Panel 3: gateway + queue ============ -->
  <rect x="810" y="20" width="370" height="500" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="995" y="52" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">04 · gateway + queue</text>
  <text x="995" y="73" text-anchor="middle" font-size="12.5" fill="#475569">connections in the gateway, work in a queue</text>

  <rect x="920" y="96" width="150" height="44" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="995" y="123" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b4b">MCP client</text>

  <line x1="995" y1="140" x2="995" y2="176" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="880" y="178" width="230" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="995" y="199" text-anchor="middle" font-size="14" font-weight="600" fill="#0c1e4a">Gateway</text>
  <text x="995" y="217" text-anchor="middle" font-size="11.5" fill="#475569">holds the connection and stream</text>

  <line x1="995" y1="228" x2="995" y2="256" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1003" y="247" font-size="11.5" fill="#475569">every call = a job</text>

  <rect x="910" y="258" width="170" height="40" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="995" y="283" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">JetStream queue</text>
  <text x="1086" y="283" font-size="11.5" fill="#475569">any free</text>
  <text x="1086" y="297" font-size="11.5" fill="#475569">worker</text>

  <line x1="975" y1="298" x2="895" y2="326" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="995" y1="298" x2="995" y2="326" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="1015" y1="298" x2="1095" y2="326" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>

  <g font-size="12.5" fill="#0c1e4a" text-anchor="middle">
    <rect x="845" y="328" width="96" height="44" rx="10" fill="#ffffff" stroke="#93c5fd"/>
    <text x="893" y="355">worker 1</text>
    <rect x="947" y="328" width="96" height="44" rx="10" fill="#ffffff" stroke="#93c5fd"/>
    <text x="995" y="355">worker 2</text>
    <rect x="1049" y="328" width="96" height="44" rx="10" fill="#ffffff" stroke="#93c5fd"/>
    <text x="1097" y="355">worker 3</text>
  </g>

  <line x1="893" y1="372" x2="935" y2="400" stroke="#d97706" stroke-width="1.3"/>
  <line x1="995" y1="372" x2="995" y2="400" stroke="#d97706" stroke-width="1.3"/>
  <line x1="1097" y1="372" x2="1055" y2="400" stroke="#d97706" stroke-width="1.3"/>
  <rect x="885" y="400" width="220" height="34" rx="9" fill="#fef3c7" stroke="#d97706"/>
  <text x="995" y="422" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">NATS key-value: state of S</text>

  <text x="995" y="462" text-anchor="middle" font-size="13" fill="#334155">A worker dies: its job is redelivered.</text>
  <text x="995" y="482" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">The session and its state survive.</text>
</svg>
