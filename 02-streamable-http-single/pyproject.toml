[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamable-http-single"
version = "0.1.0"
description = "Phase 2: MCP server over Streamable HTTP, single replica"
requires-python = ">=3.11"
dependencies = [
    "mcp==1.30.0",
    "pydantic-settings>=2.5",
    "uvicorn>=0.30",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-asgi>=0.48b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.ruff]
extend = "../ruff.toml"
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=mcpserver --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = ["*/__main__.py"]
