events {}

http {
  resolver 127.0.0.11 valid=5s ipv6=off;

  # Session IDs look like "mcp-replica-2.<uuid>". Known prefixes pick that replica;
  # no session ID (initialize) or an unknown one goes round robin.
  map $http_mcp_session_id $mcp_upstream {
    default                "mcp_round_robin";
    "~^mcp-replica-1\."    "mcp_replica_1";
    "~^mcp-replica-2\."    "mcp_replica_2";
    "~^mcp-replica-3\."    "mcp_replica_3";
  }

  upstream mcp_round_robin {
    zone mcp_round_robin 64k;
    server mcp-replica-1:8000 resolve;
    server mcp-replica-2:8000 resolve;
    server mcp-replica-3:8000 resolve;
  }
  upstream mcp_replica_1 {
    zone mcp_replica_1 64k;
    server mcp-replica-1:8000 resolve;
  }
  upstream mcp_replica_2 {
    zone mcp_replica_2 64k;
    server mcp-replica-2:8000 resolve;
  }
  upstream mcp_replica_3 {
    zone mcp_replica_3 64k;
    server mcp-replica-3:8000 resolve;
  }

  server {
    listen 8082;

    location / {
      proxy_pass http://$mcp_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
    }
  }
}
