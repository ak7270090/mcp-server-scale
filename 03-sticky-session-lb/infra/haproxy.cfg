global
  log stdout format raw local0 info

defaults
  mode http
  log global
  option httplog
  timeout connect 5s
  timeout client 1h
  timeout server 1h
  timeout http-keep-alive 10s

resolvers docker
  nameserver docker_dns 127.0.0.11:53
  hold valid 5s

frontend mcp_front
  bind :8081
  default_backend mcp_replicas

backend mcp_replicas
  balance roundrobin
  option httpchk GET /healthz
  option redispatch
  # First response sets MCP_REPLICA=<cookie>; later requests carrying it go to the same server.
  cookie MCP_REPLICA insert indirect nocache httponly
  server mcp-replica-1 mcp-replica-1:8000 check inter 2s cookie r1 resolvers docker init-addr libc,none
  server mcp-replica-2 mcp-replica-2:8000 check inter 2s cookie r2 resolvers docker init-addr libc,none
  server mcp-replica-3 mcp-replica-3:8000 check inter 2s cookie r3 resolvers docker init-addr libc,none
