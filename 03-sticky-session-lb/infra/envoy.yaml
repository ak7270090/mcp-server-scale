admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: mcp_listener
      address:
        socket_address: { address: 0.0.0.0, port_value: 8083 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: mcp
                stream_idle_timeout: 3600s
                route_config:
                  virtual_hosts:
                    - name: mcp
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: mcp_replicas
                            # No overall deadline: SSE streams stay open for the length of a tool call.
                            timeout: 0s
                            idle_timeout: 3600s
                            # Retry only when the request never reached a replica, so a
                            # tools/call is never run twice.
                            retry_policy:
                              retry_on: connect-failure,refused-stream
                              num_retries: 2
                http_filters:
                  # Response "mcp-session-id: X" becomes "base64(host);UV:base64(X)".
                  # On requests Envoy routes to that host and restores the original X.
                  - name: envoy.filters.http.stateful_session
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.stateful_session.v3.StatefulSession
                      session_state:
                        name: envoy.http.stateful_session.envelope
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.http.stateful_session.envelope.v3.EnvelopeSessionState
                          header:
                            name: mcp-session-id
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: mcp_replicas
      type: STRICT_DNS
      dns_refresh_rate: 5s
      lb_policy: ROUND_ROBIN
      connect_timeout: 2s
      health_checks:
        - timeout: 2s
          interval: 3s
          unhealthy_threshold: 2
          healthy_threshold: 1
          http_health_check:
            path: /healthz
      outlier_detection:
        consecutive_5xx: 3
        interval: 5s
        base_ejection_time: 15s
        max_ejection_percent: 67
      load_assignment:
        cluster_name: mcp_replicas
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: mcp-replica-1, port_value: 8000 }
              - endpoint:
                  address:
                    socket_address: { address: mcp-replica-2, port_value: 8000 }
              - endpoint:
                  address:
                    socket_address: { address: mcp-replica-3, port_value: 8000 }
